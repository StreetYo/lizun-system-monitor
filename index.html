<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/__sdk/lizun.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="monitor" id="monitor" hidden>
      <section class="cpu lz-card" id="cpu">
        <header class="line">
          <span class="label" id="cpu-label"></span>
          <span class="temp" id="cpu-temp"></span>
        </header>
        <div class="big" id="cpu-value"></div>
        <div class="spark">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="spark-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="currentColor" stop-opacity="0.35" />
                <stop offset="1" stop-color="currentColor" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path id="spark-area" fill="url(#spark-fill)" />
            <path id="spark-line" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
          </svg>
          <p class="hint" id="hint" hidden></p>
        </div>
      </section>

      <section class="rows lz-card">
        <div class="row" id="ram">
          <div class="line"><span class="label"></span><span class="detail"></span><span class="value"></span></div>
          <div class="bar"><i></i></div>
        </div>
        <div class="row" id="gpu">
          <div class="line">
            <span class="label"></span><span class="temp"></span><span class="detail"></span><span class="value"></span>
          </div>
          <div class="bar"><i></i></div>
        </div>
        <div class="row" id="disk">
          <div class="line"><span class="label"></span><span class="detail"></span><span class="value"></span></div>
          <div class="bar"><i></i></div>
        </div>
        <div class="row net" id="net">
          <div class="line">
            <span class="rate">
              <svg class="arrow down" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8M2.5 6.5L6 10l3.5-3.5" /></svg>
              <span id="net-down"></span>
            </span>
            <span class="rate">
              <svg class="arrow up" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2M2.5 5.5L6 2l3.5 3.5" /></svg>
              <span id="net-up"></span>
            </span>
          </div>
        </div>
        <div class="row" id="battery">
          <div class="line">
            <span class="label"></span>
            <svg class="bolt" viewBox="0 0 12 12" aria-hidden="true"><path d="M6.8 1L2.5 7h3l-.8 4L9.5 5h-3z" /></svg>
            <span class="detail"></span><span class="value"></span>
          </div>
          <div class="bar"><i></i></div>
        </div>
      </section>
    </main>
    <p class="message lz-secondary" id="message"></p>
  </body>
</html>
